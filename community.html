<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>커뮤니티 | 명조 아카이브</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-community">
  <header class="site-header">
    <h1 class="logo">
      <a href="index.html">
        <span class="logo-mark" aria-hidden="true">鳴</span>
        <span class="logo-text">명조 아카이브<small>WUTHERING WAVES ARCHIVE</small></span>
      </a>
    </h1>
    <nav class="gnb">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="info.html">세계관 / 스토리</a></li>
        <li><a href="char.html">공명자</a></li>
        <li><a href="guide.html">가이드</a></li>
        <li><a href="community.html" class="active">커뮤니티</a></li>
        <li><a href="play.html" class="nav-fav"><span aria-hidden="true">♥</span> 최애찾기</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="page-head">
      <h2>커뮤니티</h2>
      <p>유저와 함께 만들어 나가는 공간입니다. 플레이 리뷰, 밈, 소식을 자유롭게 남겨 주세요.</p>
    </div>

    <section>
      <h2 class="section-title">글쓰기</h2>
      <form class="post-form" id="post-form">
        <label>
          분류
          <select name="category">
            <option value="리뷰">리뷰</option>
            <option value="밈">밈</option>
            <option value="소식">소식</option>
            <option value="질문">질문</option>
          </select>
        </label>
        <label>
          닉네임
          <input type="text" name="author" maxlength="20" placeholder="방랑자" required>
        </label>
        <label>
          제목
          <input type="text" name="title" maxlength="60" required>
        </label>
        <label>
          내용
          <textarea name="content" maxlength="1000" required></textarea>
        </label>
        <button type="submit" class="btn">등록</button>
      </form>
      <p class="muted" style="margin-top: 8px; font-size: 0.85rem;">
        작성한 글은 지금 사용 중인 브라우저에만 저장됩니다.
      </p>
    </section>

    <section>
      <h2 class="section-title">게시글</h2>
      <div class="filter-bar" id="filter-bar">
        <button type="button" data-filter="전체" class="active">전체</button>
        <button type="button" data-filter="리뷰">리뷰</button>
        <button type="button" data-filter="밈">밈</button>
        <button type="button" data-filter="소식">소식</button>
        <button type="button" data-filter="질문">질문</button>
      </div>
      <div class="post-list" id="post-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <nav class="footer-links">
      <a href="https://github.com/seongyun09/Web_programming_project" target="_blank" rel="noopener">GitHub</a>
      <a href="mailto:example@example.com">이메일</a>
      <a href="https://wutheringwaves.kurogames.com/" target="_blank" rel="noopener">명조 공식 사이트</a>
    </nav>
    <p class="copyright">
      &copy; 2026 명조 아카이브 (팬메이드 비공식 페이지). 명조: 워더링 웨이브의 저작권은 쿠로게임즈에 있습니다.
    </p>
  </footer>

  <script src="community.js"></script>
</body>
</html>
